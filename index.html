    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <style>
      :root {
        --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        --safe-area-inset-bottom: env(safe-area-inset-bottom);
      }
      
      html, body {
        font-family: var(--font-family) !important;
        overscroll-behavior-y: none;
        min-height: 100%;
        width: 100%;
      }

      /* Desktop app feel remains locked, but allows login scroll */
      .app-is-logged-in {
        overflow: hidden;
        position: fixed;
        inset: 0;
      }

      .custom-scrollbar {
        -webkit-overflow-scrolling: touch;
      }

      .font-bold-app {
        font-weight: 600 !important;
      }
      .font-bold-app h1, .font-bold-app h2, .font-bold-app h3, .font-bold-app p, .font-bold-app span, .font-bold-app div {
        font-weight: 700 !important;
      }

      @media print {
        .no-print { display: none !important; }
        body { 
          background-color: white !important; 
          color: black !important; 
          overflow: visible !important; 
          position: static !important; 
          width: 100% !important;
          height: auto !important;
          margin: 0 !important;
          padding: 0 !important;
        }
        #root { 
          position: static !important; 
          height: auto !important; 
          overflow: visible !important; 
        }
        .printable-area { 
          display: block !important; 
          width: 100% !important; 
          margin: 0 !important; 
          padding: 0 !important; 
          border: none !important;
          box-shadow: none !important;
          background: white !important;
        }
        /* Hide everything except the printable area when printing */
        body > *:not(#root), #root > *:not(.fixed) { display: none !important; }
        .fixed.inset-0 { 
          position: static !important; 
          display: block !important; 
          background: none !important; 
          backdrop-filter: none !important; 
          padding: 0 !important; 
          overflow: visible !important;
          z-index: auto !important;
        }
        .bg-white.rounded-\[50px\], .bg-white.rounded-\[40px\] { 
          border: none !important; 
          border-radius: 0 !important; 
          box-shadow: none !important; 
          width: 100% !important; 
          max-width: none !important; 
          margin: 0 !important; 
          position: static !important;
        }
        header.no-print, footer.no-print { display: none !important; }
        
        /* Table page break handling */
        table { 
          width: 100% !important;
          border-collapse: collapse !important;
          page-break-inside: auto !important; 
          margin-bottom: 20px !important;
        }
        tr { 
          page-break-inside: avoid !important; 
          page-break-after: auto !important; 
        }
        thead { 
          display: table-header-group !important; 
        }
        tfoot { 
          display: table-footer-group !important; 
        }
        
        /* Avoid breaking sections */
        .p-8, .p-16, .p-6 {
          page-break-inside: avoid !important;
        }

        /* Ensure signature area stays together */
        .mt-32, .mt-20 {
          page-break-inside: avoid !important;
          margin-top: 50px !important;
        }

        /* Ensure text is black and backgrounds are white */
        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          color: black !important;
          text-shadow: none !important;
        }
        
        .text-primary, .text-indigo-600, .text-blue-600 {
          color: #000 !important;
        }
        
        .bg-primary, .bg-slate-900, .bg-rose-600 {
          background-color: transparent !important;
          border: 1px solid #000 !important;
          color: #000 !important;
        }

        .bg-slate-50, .bg-primary\/5 {
          background-color: #f8fafc !important;
        }

        /* Force page breaks if needed */
        .page-break {
          page-break-before: always !important;
        }
      }

      @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
      .mobile-modal { animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
      
      :root, :root[data-theme='default'] {
        --color-primary-rgb: 59 130 246; 
      }
      :root[data-theme='emerald'] { --color-primary-rgb: 16 185 129; }
      :root[data-theme='crimson'] { --color-primary-rgb: 220 38 38; }
      :root[data-theme='royal'] { --color-primary-rgb: 29 78 216; }
      :root[data-theme='indigo'] { --color-primary-rgb: 79 70 229; }
      :root[data-theme='sunset'] { --color-primary-rgb: 249 115 22; }
      :root[data-theme='teal'] { --color-primary-rgb: 20 184 166; }
      :root[data-theme='rose'] { --color-primary-rgb: 244 63 94; }
      :root[data-theme='cyan'] { --color-primary-rgb: 6 182 212; }
      :root[data-theme='fuchsia'] { --color-primary-rgb: 192 38 211; }
      :root[data-theme='amber'] { --color-primary-rgb: 245 158 11; }
      :root[data-theme='slate'] { --color-primary-rgb: 51 65 85; }
      :root[data-theme='lime'] { --color-primary-rgb: 132 204 22; }
      :root[data-theme='orange'] { --color-primary-rgb: 255 102 0; }
      
      .bg-primary { background-color: rgb(var(--color-primary-rgb)); }
      .text-primary { color: rgb(var(--color-primary-rgb)); }
      .border-primary { border-color: rgb(var(--color-primary-rgb)); }

      button { -webkit-tap-highlight-color: transparent; user-select: none; }
    </style>
