    <style>
      :root {
        --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        --safe-area-inset-bottom: env(safe-area-inset-bottom);
      }
      
      html, body {
        font-family: var(--font-family) !important;
        overscroll-behavior-y: none;
        min-height: 100%;
        width: 100%;
      }

      /* Desktop app feel remains locked, but allows login scroll */
      .app-is-logged-in {
        overflow: hidden;
        position: fixed;
        inset: 0;
      }

      .custom-scrollbar {
        -webkit-overflow-scrolling: touch;
      }

      .font-bold-app {
        font-weight: 600 !important;
      }
      .font-bold-app h1, .font-bold-app h2, .font-bold-app h3, .font-bold-app p, .font-bold-app span, .font-bold-app div {
        font-weight: 700 !important;
      }

      @media print {
        .no-print { display: none !important; }
        body { 
          background-color: white !important; 
          color: black !important; 
          overflow: visible !important; 
          position: static !important; 
          width: 100% !important;
          height: auto !important;
        }
        #root { 
          position: static !important; 
          height: auto !important; 
          overflow: visible !important; 
        }
        .printable-area { 
          display: block !important; 
          width: 100% !important; 
          margin: 0 !important; 
          padding: 20px !important; 
          border: none !important;
          box-shadow: none !important;
        }
        /* Hide everything except the printable area when printing */
        body > *:not(#root), #root > *:not(.fixed) { display: none !important; }
        .fixed.inset-0 { 
          position: static !important; 
          display: block !important; 
          background: none !important; 
          backdrop-filter: none !important; 
          padding: 0 !important; 
          overflow: visible !important;
        }
        .bg-white.rounded-\[50px\], .bg-white.rounded-\[40px\] { 
          border: none !important; 
          border-radius: 0 !important; 
          box-shadow: none !important; 
          width: 100% !important; 
          max-width: none !important; 
          margin: 0 !important; 
          position: static !important;
        }
        header.no-print, footer.no-print { display: none !important; }
        
        /* Table page break handling */
        table { page-break-inside: auto; }
        tr { page-break-inside: avoid; page-break-after: auto; }
        thead { display: table-header-group; }
        tfoot { display: table-footer-group; }
      }

      @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
      .mobile-modal { animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
      
      :root, :root[data-theme='default'] {
        --color-primary-rgb: 59 130 246; 
        --color-primary-hover-rgb: 37 99 235;
      }
      
      .bg-primary { background-color: rgb(var(--color-primary-rgb)); }
      .text-primary { color: rgb(var(--color-primary-rgb)); }
      .border-primary { border-color: rgb(var(--color-primary-rgb)); }

      button { -webkit-tap-highlight-color: transparent; user-select: none; }
    </style>
